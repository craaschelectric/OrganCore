paragraph=Scanning, input handlers, local combination action on SD or QSPI flash (all files on one medium), builder piston assignment, crescendo, MIDI I/O, display, and pitch/temperature tuning for Teensy 4.1 organ consoles. Every per-instrument fact lives in the sketch's ConfigData.h, so one copy of this library serves every console without local edits.
